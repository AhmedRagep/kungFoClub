<table class="tbl">
  <thead>
    <tr>
      <th>#</th><th>الاسم</th><th>الموبايل</th><th>الاشتراك</th>
      <th>الخصم</th><th>المطلوب</th><th>المدفوع</th><th>المتبقي</th>
    </tr>
  </thead>
  <tbody>
    {% for p in rows %}
    <tr>
      <td class="num">{{ forloop.counter }}</td>
      <td>{{ p.name }}</td>
      <td class="num">{{ p.phone|default:"—" }}</td>
      <td class="num">{{ p.fee }}</td>
      <td class="num">{{ p.discount }}</td>
      <td class="num">{{ p.due }}</td>
      <td class="num jade-text">{{ p.paid }}</td>
      <td class="num {% if p.remaining > 0 %}red-text{% endif %}">
        {% if p.remaining > 0 %}{{ p.remaining }}{% else %}خالص{% endif %}
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>
