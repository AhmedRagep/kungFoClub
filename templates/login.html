{% load static %}<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#191817">
  <title>تسجيل الدخول</title>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body style="padding:0">
<div class="login-wrap">
  <div class="login-box">
    <div class="chop">功</div>
    <h1>نادي الكونغ فو</h1>
    <p>سجّل دخولك عشان تدير الاشتراكات</p>

    {% if form.errors %}
      <div class="login-error">اسم المستخدم أو كلمة السر غلط. جرّب تاني.</div>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <div class="field">
        <label>اسم المستخدم</label>
        <input type="text" name="username" autocomplete="username" autofocus required>
      </div>
      <div class="field">
        <label>كلمة السر</label>
        <input type="password" name="password" autocomplete="current-password" required>
      </div>
      <button class="btn btn-primary" type="submit" style="width:100%">دخول</button>
    </form>
  </div>
</div>
</body>
</html>
