{% extends "base.html" %}
{% block page %}app{% endblock %}
{% block title %}{{ club_name }}{% endblock %}

{% block body %}
<header class="topbar">
  <div class="shell">
    <div class="topbar-row">
      <div class="brand">
        <div class="chop">功</div>
        <div style="min-width:0">
          <div class="brand-name">{{ club_name }}</div>
          <div class="brand-sub">اشتراكات وحضور</div>
        </div>
      </div>
      <a class="icon-btn" href="/settings/" aria-label="الإعدادات">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 8.9 19a1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 5 8.9a1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3 1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9v.1a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>
        </svg>
      </a>
    </div>

    <div class="month-strip">
      <button id="prevMonth" aria-label="الشهر السابق">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><path d="M9 18l6-6-6-6"/></svg>
      </button>
      <div class="month-label" id="monthLabel">
        <span id="monthText">…</span>
        <small id="monthSub">&nbsp;</small>
      </div>
      <button id="nextMonth" aria-label="الشهر التالي">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
    </div>
  </div>
</header>

<main class="shell">
  <div class="card stack" id="summary"></div>

  <div class="toolbar">
    <div class="search">
      <input id="search" type="search" placeholder="ابحث باسم اللاعب أو رقمه" autocomplete="off">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    </div>
    <button class="toggle-btn" id="unpaidToggle" title="اللي عليهم متبقي فقط" aria-label="اللي عليهم متبقي فقط">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M4 5h16M7 12h10M10 19h4"/></svg>
    </button>
  </div>

  <div class="chips">
    <button class="chip on" data-group="all">الكل</button>
    <button class="chip" data-group="juniors">الصغار</button>
    <button class="chip" data-group="seniors">الكبار</button>
  </div>

  <section class="players" id="list"></section>
</main>

<nav class="bottombar" id="bottombar"></nav>
{% endblock %}
